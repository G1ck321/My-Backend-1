<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111827;
      --accent-text: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ffffff 0, var(--bg) 45%, #eef2f7 100%);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(100%, 420px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(17, 24, 39, 0.08);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #9ca3af;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .result {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      min-height: 48px;
      word-break: break-word;
    }

    .hint {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Signup Demo</h1>
    <p>Create a username and password. On success, you will be signed in and redirected.</p>

    <form id="signupForm">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>

      <button type="submit">Create Account</button>
    </form>

    <div id="result" class="result">Awaiting submission.</div>
    <div class="hint">Already registered? <a href="/login-demo">Go to login</a>.</div>
  </main>

  <script>
    const form = document.getElementById('signupForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.textContent = 'Creating account...';

      const response = await fetch('/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem('access_token', data.access_token);
        result.textContent = 'Signup successful. Redirecting to dashboard...';
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 700);
      } else {
        result.textContent = data.msg || 'Signup failed.';
      }
    });
  </script>
</body>
</html>

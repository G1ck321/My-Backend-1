<!DOCTYPE html>
<html>
<head>
    <title>Signing you in...</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: system-ui;
        }

        .loader {
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #334155;
            border-top: 5px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="spinner"></div>
    </div>

    <p>Authenticating... please wait.</p>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const supabaseClient = supabase.createClient("https://pzttawvvneekxusckjzh.supabase.co", "sb_publishable_SUXifdLsOrOiUlsOjqbx_w_nLHhyJNB");

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" || event === "PASSWORD_RECOVERY") {
      // Once the session is confirmed, send them to the actual reset page
      window.location.href = "/reset";
    }
  });
</script>

</body>
</html>
